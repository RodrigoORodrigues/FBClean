<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#072A52" />
      <stop offset="40%" stop-color="#0072CE" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="bubbleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#072A52" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Outer Badges -->
  <circle cx="250" cy="250" r="236" fill="#FFFFFF" stroke="#082042" stroke-width="14" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#082042" stroke-width="2.5" />

  <!-- Sparkle Stars (Top Right) -->
  <g fill="#0099FF">
    <!-- Star 1 (Large) -->
    <path d="M 378 120 Q 378 138 392 138 Q 378 138 378 156 Q 378 138 364 138 Q 378 138 378 120 Z" />
    <!-- Star 2 (Medium) -->
    <path d="M 398 152 Q 398 163 406 163 Q 398 163 398 174 Q 398 163 390 163 Q 398 163 398 152 Z" />
    <!-- Star 3 (Small) -->
    <path d="M 358 158 Q 358 166 364 166 Q 358 166 358 174 Q 358 166 352 166 Q 358 166 358 158 Z" />
  </g>

  <!-- Letters F and B -->
  <!-- F (Deep Navy) -->
  <path d="M 105 108 L 228 108 L 228 154 L 165 154 L 165 198 L 220 198 L 220 244 L 165 244 L 165 275 L 105 275 Z" fill="#071E3D" />

  <!-- B (Vibrant Blue with slanted dynamic cut) -->
  <path d="M 238 108 L 316 108 C 348 108 368 122 368 147 C 368 164 358 177 342 184 C 363 192 374 208 374 233 C 374 262 348 276 312 276 L 238 276 Z
           M 292 143 L 292 173 L 312 173 C 324 173 331 167 331 158 C 331 149 324 143 312 143 Z
           M 292 208 L 292 242 L 316 242 C 328 242 336 235 336 225 C 336 215 328 208 316 208 Z" 
        fill="url(#blueGradient)" />

  <!-- Dynamic Water Wave under FB -->
  <path d="M 72 298 C 120 268, 175 258, 230 274 C 290 290, 335 292, 382 258 C 360 278, 318 305, 252 296 C 188 288, 134 290, 72 316 Z" 
        fill="#0077E6" opacity="0.4" />
  
  <path d="M 64 308 C 115 274, 180 266, 240 286 C 300 306, 350 298, 400 240 C 372 275, 328 318, 252 308 C 182 300, 126 304, 64 326 Z" 
        fill="url(#waveGradient)" />

  <path d="M 130 288 C 190 272, 250 286, 315 294 C 360 300, 388 286, 412 252 C 386 288, 344 316, 280 310 C 215 304, 168 302, 130 308 Z" 
        fill="#00C2FF" />

  <!-- Water Droplets / Bubbles splashing up from the wave -->
  <circle cx="396" cy="245" r="7" fill="#0080FF" />
  <circle cx="410" cy="226" r="9" fill="#00A2FF" />
  <circle cx="388" cy="216" r="5" fill="#00C8FF" />
  <circle cx="415" cy="202" r="5.5" fill="#0088FF" />
  <circle cx="402" cy="190" r="3.5" fill="#00A8FF" />

  <!-- Highlight gleams on droplets -->
  <circle cx="408" cy="223" r="2.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="394" cy="243" r="1.8" fill="#FFFFFF" opacity="0.8" />

  <!-- "CLEAN" Typography -->
  <text x="250" y="372" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Poppins', 'Arial Black', sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="14" 
        fill="#071E3D">
    CLEAN
  </text>

  <!-- "HIGIENIZAÇÃO E IMPERMEABILIZAÇÃO" -->
  <text x="250" y="405" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Poppins', sans-serif" 
        font-size="14.5" 
        font-weight="700" 
        letter-spacing="2.2" 
        fill="#0077CC">
    HIGIENIZAÇÃO E IMPERMEABILIZAÇÃO
  </text>

  <!-- "— DE ESTOFADOS —" with stylish lines -->
  <g>
    <line x1="115" y1="428" x2="182" y2="428" stroke="#082042" stroke-width="2.5" stroke-linecap="round" />
    <text x="250" y="434" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Poppins', sans-serif" 
          font-size="18" 
          font-weight="800" 
          letter-spacing="3.5" 
          fill="#082042">
      DE ESTOFADOS
    </text>
    <line x1="318" y1="428" x2="385" y2="428" stroke="#082042" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
